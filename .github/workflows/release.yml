name: Publish to Maven Central
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: central-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag, commit and POM version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag, e.g. 3.4.10' >&2
            exit 1
          fi
          tagged_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          test "$tagged_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo 'Release commit must be part of main' >&2
            exit 1
          }
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          version = ET.parse('pom.xml').findtext('{*}version')
          if os.environ['TAG'] != version:
              raise SystemExit(f'Tag does not match POM version {version}')
          PY
  test:
    needs: validate
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Sign and publish the tested revision
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          mvn --batch-mode --no-transfer-progress -DskipTests
          -DautoPublish=true -DwaitUntil=PUBLISHED clean deploy
