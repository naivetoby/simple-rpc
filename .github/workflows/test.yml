name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and RabbitMQ integration tests
        run: >-
          bash .github/rabbitmq/with-broker.sh
          mvn --batch-mode --no-transfer-progress -Prabbit-it clean test

  native:
    name: Native interop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
      - name: Build native client and server
        run: bash src/test/native/build.sh
      - name: Verify native RPC round trip
        run: >-
          bash .github/rabbitmq/with-broker.sh
          timeout 120s bash src/test/native/verify.sh
