name: JVM tests
on: [push, pull_request, workflow_call]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPRING_RABBITMQ_HOST: 127.0.0.1
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: it
      SPRING_RABBITMQ_PASSWORD: it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build test RabbitMQ with delayed exchange
        run: docker build -t simple-rpc-rabbit:it .github/rabbitmq
      - name: Start RabbitMQ and wait for the test vhost
        run: |
          docker run -d --name rpc-rabbit -p 127.0.0.1:5672:5672 \
            -e RABBITMQ_DEFAULT_USER="$SPRING_RABBITMQ_USERNAME" \
            -e RABBITMQ_DEFAULT_PASS="$SPRING_RABBITMQ_PASSWORD" \
            -e RABBITMQ_DEFAULT_VHOST=simple-rpc-it simple-rpc-rabbit:it
          broker() { docker exec rpc-rabbit "$@"; }
          for _ in {1..30}; do
            if broker rabbitmq-diagnostics -q check_port_connectivity &&
               broker rabbitmqctl -q list_vhosts name | grep -Fx simple-rpc-it
            then
              exit 0
            fi
            sleep 2
          done
          echo 'RabbitMQ did not become ready' >&2
          exit 1
      - name: Run unit and RabbitMQ integration tests
        run: mvn --batch-mode --no-transfer-progress -Prabbit-it clean test
      - name: Show RabbitMQ logs on failure
        if: failure()
        run: docker logs --tail 150 rpc-rabbit || true
      - name: Remove test broker and volume
        if: always()
        run: docker rm -fv rpc-rabbit || true
